name: Publish Vader Video Stickers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vader-video-sticker-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ea9fba2855fb0b9228c7b50d77c9674773e38504
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest -v test_stickers
      - run: python3 -m py_compile sticker_setup.py
      - name: Publish validated character video packs
        env:
          TG_JOHNNY: ${{ secrets.TG_JOHNNY }}
          CHAT_HANDLE: '@vadersocial'
        run: python3 sticker_setup.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-video-sticker-packs
          path: stickers/packs.json
          if-no-files-found: error

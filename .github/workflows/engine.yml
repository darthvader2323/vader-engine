name: Vader Room Engine
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vader-engine
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state
          key: vader-state-${{ github.run_id }}
          restore-keys: vader-state-
      - name: Upload profile photos
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_JOHNNY: ${{ secrets.TG_JOHNNY }}
          TG_YODA: ${{ secrets.TG_YODA }}
          TG_LUKE: ${{ secrets.TG_LUKE }}
          TG_CHEW: ${{ secrets.TG_CHEW }}
          TG_CHUCKY: ${{ secrets.TG_CHUCKY }}
          TG_VADER: ${{ secrets.TG_VADER }}
        run: python3 avatars.py
      - name: Run living room
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_JOHNNY: ${{ secrets.TG_JOHNNY }}
          TG_YODA: ${{ secrets.TG_YODA }}
          TG_LUKE: ${{ secrets.TG_LUKE }}
          TG_CHEW: ${{ secrets.TG_CHEW }}
          TG_CHUCKY: ${{ secrets.TG_CHUCKY }}
          TG_VADER: ${{ secrets.TG_VADER }}
          TG_BOOTSTRAP: ${{ vars.TG_BOOTSTRAP || '1' }}
        run: python3 run.py
      - name: Persist state
        if: always()
        run: |
          git config user.name "vader-engine"
          git config user.email "engine@users.noreply.github.com"
          git add state || true
          git diff --staged --quiet || git commit -m "state checkpoint" || true
          git push || true

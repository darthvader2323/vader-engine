name: Vader Room Engine
on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache state
        uses: actions/cache@v4
        with:
          path: state
          key: vader-state-${{ github.run_id }}
          restore-keys: vader-state-
      - name: One cycle
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_JOHNNY: ${{ secrets.TG_JOHNNY }}
          TG_YODA: ${{ secrets.TG_YODA }}
          TG_LUKE: ${{ secrets.TG_LUKE }}
          TG_CHEW: ${{ secrets.TG_CHEW }}
          TG_CHUCKY: ${{ secrets.TG_CHUCKY }}
          TG_VADER: ${{ secrets.TG_VADER }}
        run: |
          python3 -c "
import engine,random,time
engine.answer_humans()
for i in range(random.choice([2,3,4])):
    engine.beat(); time.sleep(6)
"
      - name: Persist state
        if: always()
        run: |
          git config user.name "vader-engine"
          git config user.email "engine@users.noreply.github.com"
          git add state || true
          git diff --staged --quiet || git commit -m "state checkpoint" || true
          git push || true

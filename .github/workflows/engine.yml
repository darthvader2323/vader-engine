name: Vader Room Engine
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore cached state
        id: cache
        uses: actions/cache@v4
        with:
          path: state
          key: vader-state-${{ github.run_id }}
          restore-keys: vader-state-
      - name: Run engine
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TG_JOHNNY: ${{ secrets.TG_JOHNNY }}
          TG_YODA: ${{ secrets.TG_YODA }}
          TG_LUKE: ${{ secrets.TG_LUKE }}
          TG_CHEW: ${{ secrets.TG_CHEW }}
          TG_CHUCKY: ${{ secrets.TG_CHUCKY }}
          TG_VADER: ${{ secrets.TG_VADER }}
        run: |
          python3 engine.py
      - name: Persist state back to repo
        if: always()
        run: |
          git config user.name "vader-engine"
          git config user.email "engine@users.noreply.github.com"
          git add state || true
          git diff --staged --quiet || git commit -m "state: engine checkpoint" || true
          git push || true
